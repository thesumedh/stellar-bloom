name: StellarBloom CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x

    - name: Install Frontend Dependencies
      working-directory: ./stellar-bloom
      run: npm install

    - name: Execute Strict TypeScript Build Matrix
      working-directory: ./stellar-bloom
      run: npm run build

    - name: Verify Backend Integrity
      working-directory: ./relayer
      run: |
        npm install
        node -c index.js

    - name: Application Pipeline Verified
      run: echo "🚀 The StellarBloom architecture compilation succeeded!"
